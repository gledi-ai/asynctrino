name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: ">=0.13,<0.14"

jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - run: uv run --locked nox --session lint format typecheck --non-interactive

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - run: uv run --locked nox --session "test-${{ matrix.python-version }}" --non-interactive -- tests/unit -n auto

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-unit-py${{ matrix.python-version }}
          path: |
            junit-*.xml
            coverage-*.xml
          if-no-files-found: warn

  integration:
    name: integration (py${{ matrix.python-version }}, trino ${{ matrix.trino }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.14", trino: previous }
          - { python-version: "3.14", trino: latest }
          - { python-version: "3.15", trino: latest }
    env:
      TRINO_VERSION: ${{ matrix.trino }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - run: >-
          uv run --locked nox --session "test-${{ matrix.python-version }}" --non-interactive
          -- tests/integration -n auto --cov-fail-under=0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-integration-py${{ matrix.python-version }}-trino-${{ matrix.trino }}
          path: |
            junit-*.xml
            coverage-*.xml
          if-no-files-found: warn
