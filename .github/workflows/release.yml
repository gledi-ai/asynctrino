name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  UV_VERSION: ">=0.13,<0.14"

jobs:
  classify:
    name: classify tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            echo "kind=rc" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag '$TAG' is neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi

  build:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Check the changelog has a section for a stable release
        if: needs.classify.outputs.kind == 'stable'
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$VERSION] section; run make changelog VERSION=v$VERSION"
            exit 1
          fi

      - run: make build

      - name: Check the built version matches the tag
        env:
          EXPECTED: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          for artifact in "dist/asynctrino-$EXPECTED-py3-none-any.whl" "dist/asynctrino-$EXPECTED.tar.gz"; do
            if [[ ! -f "$artifact" ]]; then
              echo "::error::Expected $artifact, built: $(ls dist)"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  check:
    name: install and import (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: uv run --locked nox --session "dist-${{ matrix.python-version }}" --non-interactive

  publish-testpypi:
    name: publish to TestPyPI
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/asynctrino
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  publish-pypi:
    name: publish to PyPI
    needs: [classify, publish-testpypi]
    if: needs.classify.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/asynctrino
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  github-release:
    name: GitHub Release
    needs: [classify, publish-pypi]
    if: needs.classify.outputs.kind == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - run: make --silent release/notes > RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
