# git-cliff configuration: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to asynctrino, generated from its Conventional Commits.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}

"""
trim = false
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/gledi-ai/asynctrino/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^\\w+(\\(.+\\))?: [Mm]erge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci|chore)", group = "<!-- 5 -->Miscellaneous" },
  { message = ".*", skip = true },
]
filter_commits = false
# Stable tags only, so rc tags fold into their release.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
