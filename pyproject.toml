[project]
name = "asynctrino"
dynamic = ["version"]
description = "Fully typed asyncio client for the Trino distributed SQL engine, built on httpx2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.16"
authors = [
  { name = "Gledi Caushaj", email = "201947707+gledi-ai@users.noreply.github.com" },
]
keywords = ["trino", "asyncio", "database", "sql", "dbapi", "httpx2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Database :: Front-Ends",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2.12,<3",
  "lz4>=4.0,<5",
  "python-dateutil>=2.8.2,<3",
  "tzlocal>=5.0,<6",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.1,<2.2"]

[project.entry-points."sqlalchemy.dialects"]
asynctrino = "asynctrino.sqlalchemy._dialect:TrinoDialect"

[project.urls]
Homepage = "https://github.com/gledi-ai/asynctrino"
Repository = "https://github.com/gledi-ai/asynctrino"
Issues = "https://github.com/gledi-ai/asynctrino/issues"

[dependency-groups]
lint = ["pyrefly~=1.4", "ruff~=0.17", "types-python-dateutil~=2.9"]
test = [
  "coverage[toml]~=7.16",
  "pytest~=9.1",
  "pytest-asyncio~=1.4",
  "pytest-cov~=7.1",
  "pytest-sugar~=1.1",
  "pytest-xdist~=3.8",
  "testcontainers~=4.15",
  "trustme~=1.2",
]
dev = [{ include-group = "lint" }, { include-group = "test" }]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default"
fallback-version = "0.0.0"
bump = true

[tool.hatch.build.targets.wheel]
packages = ["src/asynctrino"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE"]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { ruff = "1 day", certifi = "1 day" }

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
  "CPY",    # no per-file copyright headers; LICENSE and NOTICE cover it
  "D105",   # magic methods are documented by their protocol
  "D107",   # __init__ is documented on the class
  "TC001",  # with 3.14 deferred annotations, TYPE_CHECKING-only imports are pure churn
  "TC002",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",
  "PLR2004",
  "SLF001",
  "S105",    # fake passwords and tokens are test data
  "S106",    # the same, passed as keyword arguments
  "D",       # test names say what they check
  "DTZ001",  # naive datetimes are expected values for TIMESTAMP without time zone
]
"src/asynctrino/sqlalchemy/_compiler.py" = [
  "N801", # window functions are named after the SQL functions they render, like SQLAlchemy's
  "N802", # SQLAlchemy dispatches types to visit_<UPPERCASE name>
]
"noxfile.py" = ["D"] # sessions are described by their names
"typings/**" = ["A002"] # stubs mirror upstream parameter names

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"
search-path = ["."]
preset = "all"
strict-callable-subtyping = true
strict-partial-subtyping = true
check-unannotated-defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["asynctrino"]
branch = true
core = "sysmon"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]
