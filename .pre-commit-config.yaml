default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: uv.lock
      - id: check-ast
      - id: debug-statements
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (lint)
        entry: uv run --locked --group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: Ruff (format check)
        entry: uv run --locked --group dev ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyrefly
        name: Pyrefly (typecheck)
        entry: uv run --locked --group dev pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
