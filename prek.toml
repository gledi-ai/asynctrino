#:schema https://www.schemastore.org/prek.json

default_language_version = { python = "python3.14" }
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"
exclude = "uv.lock"

[[repos.hooks]]
id = "check-ast"

[[repos.hooks]]
id = "debug-statements"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff (lint)"
entry = "uv run --locked --only-group lint ruff check --force-exclude"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "Ruff (format check)"
entry = "uv run --locked --only-group lint ruff format --check --force-exclude"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "pyrefly"
name = "Pyrefly (typecheck)"
entry = "uv run --locked --extra sqlalchemy pyrefly check"
language = "system"
types_or = ["python", "pyi"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "conventional-commit"
name = "Conventional Commit message"
entry = '\A(?!(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\([a-z0-9._/-]+\))?!?: \S|Merge |Revert "|(?:fixup|squash|amend)! )'
language = "pygrep"
args = ["--multiline"]
stages = ["commit-msg"]

[[repos.hooks]]
id = "branch-name"
name = "Branch name"
entry = '''bash -c 'b=$(git symbolic-ref --quiet --short HEAD) || exit 0; [[ $b =~ ^(main|(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[a-z0-9][a-z0-9._-]*|release/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?|renovate/.+)$ ]] || { echo "Branch $b should be <type>/<slug>, release/vX.Y.Z or main"; exit 1; }' '''
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]
